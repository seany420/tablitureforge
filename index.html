<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="AXELAB: guitar backing tracks, a live scale-following fretboard, playable tab, lessons, theory and ear training.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXELAB">
<meta name="theme-color" content="#b8860b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<title>AXELAB Guitar Lab</title>
<script>
  (function () { try { var t = JSON.parse(localStorage.getItem('axelab2.theme')); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
</head>
<body>
<header class="hdr">
  <div class="logo">AXE<span>LAB</span></div>
  <div class="hdr-mid">
    <button class="tp-btn" id="tpPlay" type="button" aria-label="Play backing track">
      <svg viewBox="0 0 24 24" id="tpIcon"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <div class="tp-info">
      <div class="tp-chord" id="tpChord">A7</div>
      <div class="tp-sub" id="tpSub">12-Bar Blues · 92 bpm</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Light / dark">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<nav class="nav" aria-label="Sections">
  <button class="ni active" data-panel="jam" type="button">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Jam
  </button>
  <button class="ni" data-panel="neck" type="button">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><line x1="7" y1="7" x2="7" y2="17"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="17" y1="7" x2="17" y2="17"/><circle cx="9.5" cy="12" r="1.3"/></svg>Neck
  </button>
  <button class="ni" data-panel="learn" type="button">
    <svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 014 4v13a3 3 0 00-3-3H2z"/><path d="M22 4h-6a4 4 0 00-4 4v13a3 3 0 013-3h7z"/></svg>Learn
  </button>
  <button class="ni" data-panel="theory" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>Theory
  </button>
  <button class="ni" data-panel="ear" type="button">
    <svg viewBox="0 0 24 24"><path d="M6 8.5a6 6 0 1112 0c0 3.5-3 4.5-3.5 7.5a3.5 3.5 0 01-6.6 1.3"/><path d="M9.5 9a2.5 2.5 0 015 0c0 1.5-1.5 2-1.5 3.5"/></svg>Ear
  </button>
  <button class="ni" data-panel="tools" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Tools
  </button>
</nav>

<main>
  <div class="panel active" id="panel-jam"></div>
  <div class="panel" id="panel-neck"></div>
  <div class="panel" id="panel-learn"></div>
  <div class="panel" id="panel-theory"></div>
  <div class="panel" id="panel-ear"></div>
  <div class="panel" id="panel-tools"></div>
</main>

<script src="js/theory.js"></script>
<script src="js/guitar.js"></script>
<script src="js/audio.js"></script>
<script src="js/band.js"></script>
<script src="js/fretboard.js"></script>
<script src="js/tab.js"></script>
<script src="js/ui.js"></script>
<script src="js/diagram.js"></script>
<script src="js/content/lessons.js"></script>
<script src="js/content/techniques.js"></script>
<script src="js/content/artists.js"></script>
<script src="js/content/routines.js"></script>
<script src="js/app.js"></script>
<script src="js/panels/jam.js"></script>
<script src="js/panels/neck.js"></script>
<script src="js/panels/learn.js"></script>
<script src="js/panels/theory.js"></script>
<script src="js/panels/ear.js"></script>
<script src="js/panels/tools.js"></script>
<script>App.init();</script>
</body>
</html>
